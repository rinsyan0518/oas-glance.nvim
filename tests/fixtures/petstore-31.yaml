openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
  description: A sample pet store
servers:
  - url: https://api.example.com/v1
tags:
  - name: pets
    description: Everything about pets
  - name: store
paths:
  /pets:
    get:
      tags: [pets]
      summary: List all pets
      operationId: listPets
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      tags: [pets]
      summary: Create a pet
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: The id of the pet
        schema:
          type: string
    get:
      tags: [pets]
      summary: Info for a specific pet
      operationId: showPetById
      parameters:
        - name: verbose
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Expected response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [pets]
      summary: Delete a pet
      operationId: deletePet
      deprecated: true
      responses:
        "204":
          description: Deleted
  /store/inventory:
    get:
      tags: [store]
      summary: Inventory
      operationId: getInventory
      responses:
        "200":
          description: Stock by status
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Healthy
webhooks:
  newPet:
    post:
      summary: A pet was added
      responses:
        "200":
          description: Received
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Pet:
      type: object
      description: A pet in the store
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          enum: ["available", "sold"]
        weight:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        nickname:
          type: [string, "null"]
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        owner:
          $ref: ./common.yaml#/Owner
        parent:
          $ref: "#/components/schemas/Pet"
        legacy:
          type: string
          deprecated: true
        gone:
          $ref: ./gone.yaml
      oneOf:
        - $ref: "#/components/x-animals/Cat"
        - $ref: "#/components/x-animals/Dog"
      discriminator:
        propertyName: petType
  x-animals:
    Cat:
      type: object
    Dog:
      type: object
