name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, arch: amd64 }
          - { runner: ubuntu-26.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: image
        run: echo "tag=$(scripts/docker-run.sh tag)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=stable-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=stable-${{ matrix.arch }}
      - run: make check

  nightly:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, arch: amd64 }
          - { runner: ubuntu-26.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: image
        run: echo "tag=$(scripts/docker-run.sh tag)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: NVIM_TAG=nightly
          no-cache-filters: neovim
          cache-from: type=gha,scope=nightly-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nightly-${{ matrix.arch }}
      - run: make check
